}</script><script>let briefing=null;let activeCategory='全部';const list=document.querySelector('#newsList');const audio=document.querySelector('#audio');const escapeHtml=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
function render(){document.querySelector('#briefTitle').textContent=briefing.title;document.querySelector('#overview').textContent=briefing.overview;document.querySelector('#meta').textContent=`${briefing.items.length} 条 · ${new Date(briefing.generated_at).toLocaleString('zh-CN')}`;const cats=['全部',...new Set(briefing.items.map(x=>x.category))];document.querySelector('#filters').innerHTML=cats.map(c=>`<button class="${c===activeCategory?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.cat;render()});if(briefing.audio_url){audio.src=briefing.audio_url;audio.style.display='block';document.querySelector('#nowPlaying').textContent='点击播放整期播报，音频仅在播放时加载'}else{audio.style.display='none';document.querySelector('#nowPlaying').textContent='固定音频尚未生成，可使用省流量朗读'}const items=briefing.items.filter(x=>activeCategory==='全部'||x.category===activeCategory);list.innerHTML=items.map((x,i)=>`<article class="story"><div class="rank">${String(i+1).padStart(2,'0')}</div><div><div class="story-top"><span class="category">${escapeHtml(x.category)}</span><time class="time">${new Date(x.published_at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</time></div><h2>${escapeHtml(x.title)}</h2><p>${escapeHtml(x.summary)}</p><p class="analysis"><strong>为什么重要：</strong>${escapeHtml(x.analysis)}</p><div class="source-row">${(x.sources||[]).map(s=>`<a href="${encodeURI(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.name)} ↗</a>`).join('')}${chapterButton(x)}</div></div></article>`).join('')||'<p class="empty">这个栏目今天没有内容。</p>'}
function chapterButton(item){const c=(briefing.chapters||[]).find(c=>c.news_id===item.id);return c&&briefing.audio_url?`<button class="chapter-link" data-seek="${c.start_seconds}">从本条收听 · ${formatTime(c.start_seconds)}</button>`:''}
function formatTime(n){return `${Math.floor(n/60)}:${String(Math.round(n%60)).padStart(2,'0')}`}
list.onclick=e=>{const b=e.target.closest('[data-seek]');if(b){audio.currentTime=Number(b.dataset.seek);audio.play();document.querySelector('#nowPlaying').textContent=b.closest('.story').querySelector('h2').textContent}}
async function load(path='data/latest.json'){const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw new Error('日报读取失败');briefing=await r.json();activeCategory='全部';render()}
async function loadArchive(){try{const r=await fetch('archive/index.json',{cache:'no-store'});const dates=await r.json();const s=document.querySelector('#dateSelect');s.innerHTML=dates.map((d,i)=>`<option value="${d}" ${i===0?'selected':''}>${d}${i===0?' · 最新':''}</option>`).join('');s.onchange=()=>load(`archive/${s.value}.json`)}catch(e){document.querySelector('#dateSelect').innerHTML='<option>暂无归档</option>'}}
document.querySelector('#themeButton').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)};document.documentElement.dataset.theme=localStorage.getItem('theme')||'';
document.querySelector('#speakButton').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance([briefing.overview,...briefing.items.flatMap(x=>[x.title,x.summary,x.analysis])].join('。'));u.lang='zh-CN';u.rate=.95;speechSynthesis.speak(u)};
const embedded=document.querySelector('#briefingData');if(embedded){briefing=JSON.parse(embedded.textContent);render();loadArchive()}else{load().then(loadArchive).catch(e=>{list.innerHTML=`<p class="empty">${escapeHtml(e.message)}，请先在管理页生成日报。</p>`})}</script>
